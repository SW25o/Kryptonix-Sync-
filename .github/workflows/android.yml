name: Kryptonix Sync CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle Build Engine
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      run: |
        cd kotlin/app
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Setup Keystore Credentials
      run: |
        echo "Creating signing keys..."
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > kotlin/app/debug.keystore || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kryptonix-sync-debug-apk
        path: kotlin/app/build/outputs/apk/debug/*.apk
        
